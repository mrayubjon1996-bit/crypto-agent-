
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AYUB CRYPTO TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #070709;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            user-select: none;
        }
        .header {
            text-align: center;
            font-size: 13px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0,229,255,0.5);
            margin-bottom: 20px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .ticker-select {
            background: #111;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 8px;
            font-family: monospace;
            width: 100%;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
        }
        .price-box {
            background: #101014;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,255,102,0.1);
            margin-bottom: 20px;
        }
        .price-value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .change-value { font-size: 16px; }
        .change-up { color: #00ff66; }
        .change-down { color: #ff3366; }
        .chart-container {
            position: relative;
            width: 100%;
            background: #0d0d11;
            border: 1px solid #00ff66;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <code>[⚡ AYUB INTELLIGENT CRYPTO SYSTEM]</code><br>
        СТАТУС: ПОДКЛЮЧЕНО К БИРЖЕ BINANCE
    </div>

    <select class="ticker-select" id="cryptoSelect">
        <option value="BTCUSDT">BTC / USDT (Bitcoin)</option>
        <option value="ETHUSDT">ETH / USDT (Ethereum)</option>
        <option value="SOLUSDT">SOL / USDT (Solana)</option>
    </select>

    <div class="price-box">
        <div style="color: #888; font-size: 12px;">ТЕКУЩАЯ СТОИМОСТЬ</div>
        <div class="price-value" id="cryptoPrice">Загрузка...</div>
        <div class="change-value" id="cryptoChange">0.00%</div>
    </div>

    <div class="chart-container">
        <canvas id="cryptoChart"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentSymbol = "BTCUSDT";
        let chart;

        const priceEl = document.getElementById('cryptoPrice');
        const changeEl = document.getElementById('cryptoChange');
        const selectEl = document.getElementById('cryptoSelect');

        async function loadData(symbol) {
            try {
                const tickerRes = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                const tickerData = await tickerRes.json();
                
                const price = parseFloat(tickerData.lastPrice).toFixed(2);
                const change = parseFloat(tickerData.priceChangePercent).toFixed(2);

                priceEl.innerText = `$ ${price}`;
                if (change >= 0) {
                    changeEl.innerText = `+${change}% (Вверх за 24ч)`;
                    changeEl.className = "change-value change-up";
                } else {
                    changeEl.innerText = `${change}% (Вниз за 24ч)`;
                    changeEl.className = "change-value change-down";
                }

                const klinesRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=24`);
                const klinesData = await klinesRes.json();

                const prices = klinesData.map(k => parseFloat(k[4]));
                const labels = klinesData.map((k, index) => `${index + 1}ч`);

                if (chart) chart.destroy();

                const ctx = document.getElementById('cryptoChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels.reverse(),
                        datasets: [{
                            label: symbol,
                            data: prices,
                            borderColor: '#00ff66',
                            borderWidth: 2,
                            pointRadius: 1,
                            backgroundColor: 'rgba(0, 255, 102, 0.05)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: { grid: { color: '#222' }, ticks: { color: '#888' } },
                            y: { grid: { color: '#222' }, ticks: { color: '#888' } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            } catch (err) {
                priceEl.innerText = "Ошибка загрузки";
            }
        }

        selectEl.addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            loadData(currentSymbol);
        });

        loadData(currentSymbol);
        setInterval(() => loadData(currentSymbol), 7000);
    </script>
</body>
</html>
